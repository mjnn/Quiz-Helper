name: iOS Build & Test

on:
  push:
    branches: [main, master]
    paths:
      - "AiTrainerIOS/**"
      - "AiTrainer/app/src/main/assets/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "AiTrainerIOS/**"
      - "AiTrainer/app/src/main/assets/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  ios:
    name: Build AiTrainerIOS + SRS tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Sync question bank assets
        working-directory: AiTrainerIOS
        run: python3 scripts/sync_assets.py

      - name: Run SRS unit tests (Swift Package)
        working-directory: AiTrainerIOS/AiTrainerCore
        shell: bash
        run: |
          set -euxo pipefail
          LOG="${GITHUB_WORKSPACE}/swift-test.log"
          swift build -v 2>&1 | tee "$LOG"
          swift test -v 2>&1 | tee -a "$LOG"

      - name: Print SRS test log on failure
        if: failure()
        shell: bash
        run: |
          LOG="${GITHUB_WORKSPACE}/swift-test.log"
          if [ -f "$LOG" ]; then
            echo "## swift-test.log (last 200 lines)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 200 "$LOG" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 200 "$LOG"
          else
            echo "Log file not found: $LOG"
          fi

      - name: Generate Xcode project
        working-directory: AiTrainerIOS
        run: xcodegen generate

      - name: Resolve iOS Simulator
        id: sim
        working-directory: AiTrainerIOS
        run: |
          set -euo pipefail
          for NAME in "iPhone 16" "iPhone 16 Pro" "iPhone 15" "iPhone 15 Pro" "iPhone SE (3rd generation)"; do
            if xcrun simctl list devices available | grep -F "$NAME" | grep -q .; then
              echo "name=$NAME" >> "$GITHUB_OUTPUT"
              echo "Using simulator: $NAME"
              exit 0
            fi
          done
          echo "No suitable iPhone simulator found"
          xcrun simctl list devices available
          exit 1

      - name: Build for iOS Simulator
        working-directory: AiTrainerIOS
        run: |
          set -euo pipefail
          xcodebuild build \
            -project AiTrainer.xcodeproj \
            -scheme AiTrainer \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "${GITHUB_WORKSPACE}/xcodebuild-build.log"

      - name: Print xcodebuild log on failure
        if: failure()
        shell: bash
        run: |
          LOG="${GITHUB_WORKSPACE}/xcodebuild-build.log"
          if [ -f "$LOG" ]; then
            echo "## xcodebuild errors" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:" "$LOG" | tail -n 50 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "---- xcodebuild errors ----"
            grep -E "error:" "$LOG" | tail -n 50 || true
            echo "---- xcodebuild log tail ----"
            tail -n 80 "$LOG"
          fi

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-logs
          path: |
            ${{ github.workspace }}/swift-test.log
            ${{ github.workspace }}/xcodebuild-build.log
          if-no-files-found: warn
