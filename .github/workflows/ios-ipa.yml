name: iOS Export IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method (development=开发证书/ad-hoc=内测/app-store=TestFlight)"
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
        default: development
      upload_testflight:
        description: "Upload to TestFlight when export_method=app-store"
        type: boolean
        default: false

jobs:
  ipa:
    name: Archive & export device IPA
    runs-on: macos-15
    timeout-minutes: 45

    env:
      TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
      API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in TEAM_ID API_KEY_ID API_ISSUER_ID API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret for $name (see AiTrainerIOS/docs/device-ipa-setup.md)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Apple Team ID: $TEAM_ID"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Sync question bank assets
        working-directory: AiTrainerIOS
        run: python3 scripts/sync_assets.py

      - name: Run SRS unit tests
        working-directory: AiTrainerIOS/AiTrainerCore
        run: swift test

      - name: Generate Xcode project
        working-directory: AiTrainerIOS
        run: xcodegen generate

      - name: Configure App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${API_KEY_ID}.p8"
          echo -n "$API_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          echo "APP_STORE_CONNECT_API_KEY_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_API_KEY_ISSUER_ID=$API_ISSUER_ID" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Prepare ExportOptions.plist
        working-directory: AiTrainerIOS
        shell: bash
        run: |
          set -euo pipefail
          METHOD="${{ github.event.inputs.export_method }}"
          sed -e "s/__TEAM_ID__/$TEAM_ID/g" -e "s/__EXPORT_METHOD__/$METHOD/g" \
            ExportOptions.plist.template > ExportOptions.plist
          cat ExportOptions.plist

      - name: Archive for iOS device
        working-directory: AiTrainerIOS
        shell: bash
        run: |
          set -euxo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/AiTrainer.xcarchive"
          xcodebuild archive \
            -project AiTrainer.xcodeproj \
            -scheme AiTrainer \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            | tee "${GITHUB_WORKSPACE}/xcodebuild-archive.log"
          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export IPA
        working-directory: AiTrainerIOS
        shell: bash
        run: |
          set -euxo pipefail
          EXPORT_DIR="$RUNNER_TEMP/ipa-export"
          mkdir -p "$EXPORT_DIR"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            | tee "${GITHUB_WORKSPACE}/xcodebuild-export.log"
          IPA_PATH=$(find "$EXPORT_DIR" -name '*.ipa' | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "No .ipa found in $EXPORT_DIR"
            ls -laR "$EXPORT_DIR"
            exit 1
          fi
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Exported IPA: $IPA_PATH ($(du -h "$IPA_PATH" | cut -f1))"

      - name: Upload TestFlight (optional)
        if: github.event.inputs.export_method == 'app-store' && github.event.inputs.upload_testflight == true
        shell: bash
        run: |
          set -euxo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_KEY_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiTrainer-${{ github.event.inputs.export_method }}-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        shell: bash
        run: |
          echo "## IPA export succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- Method: \`${{ github.event.inputs.export_method }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download artifact: **AiTrainer-${{ github.event.inputs.export_method }}-ipa**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bundle ID: \`com.aitrainer.practice\`" >> "$GITHUB_STEP_SUMMARY"
